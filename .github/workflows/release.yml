name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/models
          key: models-${{ hashFiles('model.json') }}
      - run: npm run fetch-model
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run lint
      - name: Add the changelog to the AMO metadata
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$prev" ] && ! git diff --quiet "$prev" "$GITHUB_REF_NAME" -- RELEASE_NOTES.md; then
            cp RELEASE_NOTES.md release-notes.txt
          else
            git log --first-parent --format=%s "${prev:+$prev..}$GITHUB_REF_NAME" \
              | sed -E '/^Release [0-9]/d; s/ \(#[0-9]+\)$//; s/^/- /' > release-notes.txt
          fi
          cat release-notes.txt
          jq --rawfile notes release-notes.txt '.version.release_notes = {"en-US": ($notes | rtrimstr("\n"))}' \
            amo-metadata.json > amo-metadata.release.json
      - name: Submit to addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          git archive --format=zip -o source.zip HEAD
          npx web-ext sign --channel listed --source-dir dist --upload-source-code source.zip --amo-metadata amo-metadata.release.json --approval-timeout 0
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.txt
