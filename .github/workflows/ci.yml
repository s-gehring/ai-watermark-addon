name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: vendor/models
          key: models-${{ hashFiles('model.json') }}
      - run: npm run fetch-model
      - run: npm run test:e2e
      - run: npm run lint
      - run: npx web-ext build --source-dir dist --overwrite-dest
      - uses: actions/upload-artifact@v4
        with:
          name: ai-watermark-addon
          path: web-ext-artifacts/*.zip
          retention-days: 14
