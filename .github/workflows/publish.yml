name: Publish

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Publish draft releases approved on addons.mozilla.org
        env:
          GH_TOKEN: ${{ github.token }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          releases=$(gh release list --limit 100 --json tagName,isDraft)
          newest=$(jq -r '.[].tagName' <<<"$releases" | sort -V | tail -1)
          failed=0
          published=0
          for tag in $(jq -r '.[] | select(.isDraft) | .tagName' <<<"$releases" | sort -V); do
            xpi="ai-watermark-$tag.xpi"
            status=0
            node scripts/amo-download.mjs "${tag#v}" "$xpi" || status=$?
            case "$status" in
              0)
                gh release upload "$tag" "$xpi"
                gh release edit "$tag" --draft=false --latest=false
                published=1
                ;;
              3) ;;
              4)
                if [ "$tag" != "$newest" ]; then
                  echo "::notice::$tag is disabled on addons.mozilla.org and superseded by $newest, deleting its draft release"
                  gh release delete "$tag" --yes
                else
                  echo "::error::$tag is disabled on addons.mozilla.org"
                  failed=1
                fi
                ;;
              *) failed=1 ;;
            esac
          done
          if [ "$published" = 1 ]; then
            gh release edit "$(gh release list --limit 100 --exclude-drafts --json tagName --jq '.[].tagName' | sort -V | tail -1)" --latest
          fi
          exit "$failed"
