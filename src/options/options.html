<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1 data-i18n="optionsTitle"></h1>
      <form id="form">
        <label class="field">
          <span data-i18n="optionsMinSize"></span>
          <input type="number" name="minSize" min="16" max="4096" step="10" />
        </label>
        <label class="field">
          <span data-i18n="optionsThreshold"></span>
          <span class="range"><input type="range" name="threshold" min="5" max="95" step="1" /><output id="thresholdValue"></output></span>
          <small class="muted" data-i18n="optionsThresholdHint"></small>
        </label>
        <label class="check"><input type="checkbox" name="checkMetadata" /><span data-i18n="optionsCheckMetadata"></span></label>
        <label class="check"><input type="checkbox" name="includeBackgrounds" /><span data-i18n="optionsIncludeBackgrounds"></span></label>
        <label class="check"><input type="checkbox" name="showScore" /><span data-i18n="optionsShowScore"></span></label>
        <label class="field">
          <span data-i18n="optionsDisabledHosts"></span>
          <textarea name="disabledHosts" rows="4" spellcheck="false"></textarea>
        </label>
      </form>
      <p class="muted" id="saved" data-i18n="optionsSaved" hidden></p>
      <p class="muted" data-i18n="optionsAbout"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
